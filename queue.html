<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>队列 Queue - 数据结构可视化</title>
    <style>
        * { margin: 0; padding:0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }
        .header { text-align: center; margin-bottom: 40px; }
        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }
        .header p { color: rgba(255,255,255,0.5); font-size: 1.1em; }
        .back-link {
            position: fixed;
            top: 20px;
            left: 20px;
            color: rgba(255,255,255,0.5);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color 0.3s;
        }
        .back-link:hover { color: #fff; }
        .back-link svg { width: 20px; height: 20px; }

        .container { display: flex; gap: 40px; max-width: 1000px; width: 100%; flex-wrap: wrap; justify-content: center; }

        .queue-container { flex: 1; min-width: 300px; max-width: 450px; }
        .queue-wrapper {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .queue-label {
            text-align: center;
            margin-bottom: 20px;
            color: rgba(255,255,255,0.6);
            font-size: 0.9em;
        }
        .queue {
            display: flex;
            align-items: center;
            min-height: 120px;
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 15px;
            position: relative;
            overflow-x: auto;
        }
        .queue::before {
            content: '← 入队 (REAR)';
            position: absolute;
            right: 10px;
            top: -25px;
            font-size: 0.7em;
            color: #00b4db;
        }
        .queue::after {
            content: '出队 (FRONT) →';
            position: absolute;
            left: 10px;
            bottom: -25px;
            font-size: 0.7em;
            color: #00b4db;
        }
        .queue-item {
            min-width: 60px;
            height: 70px;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1em;
            color: #fff;
            margin-right: 10px;
            animation: enqueue 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 180, 219, 0.3);
            flex-shrink: 0;
        }
        .queue-item.dequeueing {
            animation: dequeue 0.3s ease forwards;
        }
        @keyframes enqueue {
            from { transform: translateX(30px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes dequeue {
            from { transform: translateX(0); opacity: 1; }
            to { transform: translateX(-50px); opacity: 0; }
        }
        .queue-empty {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 90px;
            color: rgba(255,255,255,0.3);
            font-size: 0.9em;
        }

        .controls { flex: 1; min-width: 300px; max-width: 400px; }
        .control-panel {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .control-title { font-size: 1.2em; margin-bottom: 20px; color: rgba(255,255,255,0.8); }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; color: rgba(255,255,255,0.6); font-size: 0.9em; }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 1em;
            outline: none;
            transition: border-color 0.3s;
        }
        .input-group input:focus { border-color: #00b4db; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }
        .btn {
            flex: 1;
            min-width: 100px;
            padding: 14px 20px;
            border: none;
            border-radius: 10px;
            font-size: 0.95em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn svg { width: 18px; height: 18px; }
        .btn-enqueue {
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: #fff;
        }
        .btn-enqueue:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 180, 219, 0.4);
        }
        .btn-dequeue {
            background: rgba(255,255,255,0.1);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .btn-dequeue:hover { background: rgba(255,255,255,0.15); }
        .btn-clear {
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }
        .btn-clear:hover { background: rgba(239, 68, 68, 0.3); }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .info-panel {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: rgba(255,255,255,0.5); }
        .info-value { color: #00b4db; font-weight: 600; }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            font-weight: 500;
            animation: slideIn 0.3s ease;
            z-index: 100;
        }
        .message.success { background: rgba(76, 175, 80, 0.9); }
        .message.error { background: rgba(244, 67, 54, 0.9); }
        .message.info { background: rgba(33, 150, 243, 0.9); }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }

        .description {
            max-width: 800px;
            margin-top: 40px;
            padding: 30px;
            background: rgba(255,255,255,0.03);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .description h3 { color: #00b4db; margin-bottom: 15px; }
        .description p { color: rgba(255,255,255,0.6); line-height: 1.8; margin-bottom: 15px; }
        .description ul { color: rgba(255,255,255,0.5); padding-left: 20px; line-height: 1.8; }
        .complexity { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .complexity-item {
            padding: 10px 20px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }
        .complexity-item span { display: block; font-size: 0.8em; color: rgba(255,255,255,0.4); margin-bottom: 5px; }
        .complexity-item strong { color: #00b4db; }

        @media (max-width: 768px) {
            .container { flex-direction: column; align-items: center; }
        }
    </style>
</head>
<body>
    <a href="index.html" class="back-link">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        返回首页
    </a>

    <div class="header">
        <h1>队列 Queue</h1>
        <p>First In First Out (FIFO)</p>
    </div>

    <div class="container">
        <div class="queue-container">
            <div class="queue-wrapper">
                <div class="queue-label">队列可视化</div>
                <div class="queue" id="queue">
                    <div class="queue-empty">队列为空</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="control-panel">
                <div class="control-title">操作面板</div>
                <div class="input-group">
                    <label>入队元素</label>
                    <input type="text" id="inputValue" placeholder="输入要入队的值..." maxlength="20">
                </div>
                <div class="btn-group">
                    <button class="btn btn-enqueue" onclick="enqueue()">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m0-16l-6 6m6-6l6 6"/></svg>
                        入队 Enqueue
                    </button>
                    <button class="btn btn-dequeue" onclick="dequeue()" id="btnDequeue">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14M19 12l-6-6m6 6l-6 6"/></svg>
                        出队 Dequeue
                    </button>
                </div>
                <div class="btn-group" style="margin-top: 10px;">
                    <button class="btn btn-clear" onclick="clearQueue()">
                        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M3 4h18"/></svg>
                        清空队列
                    </button>
                </div>
                <div class="info-panel">
                    <div class="info-row">
                        <span class="info-label">队列大小</span>
                        <span class="info-value" id="queueSize">0</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">队首元素</span>
                        <span class="info-value" id="frontElement">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">队尾元素</span>
                        <span class="info-value" id="rearElement">-</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">状态</span>
                        <span class="info-value" id="queueStatus">空队列</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="description">
        <h3>什么是队列？</h3>
        <p>队列是一种先进先出 (FIFO, First In First Out) 的线性数据结构。想象排队买票，先来的人先买到票离开。</p>
        <ul>
            <li><strong>入队 (Enqueue)</strong>：将元素添加到队尾</li>
            <li><strong>出队 (Dequeue)</strong>：移除并返回队首元素</li>
            <li><strong>查看队首 (Peek)</strong>：查看队首元素但不移除</li>
        </ul>
        <div class="complexity">
            <div class="complexity-item">
                <span>入队时间复杂度</span>
                <strong>O(1)</strong>
            </div>
            <div class="complexity-item">
                <span>出队时间复杂度</span>
                <strong>O(1)</strong>
            </div>
            <div class="complexity-item">
                <span>空间复杂度</span>
                <strong>O(n)</strong>
            </div>
        </div>
    </div>

    <script>
        let queue = [];
        const maxSize = 10;

        function updateDisplay() {
            const queueEl = document.getElementById('queue');
            const btnDequeue = document.getElementById('btnDequeue');
            
            if (queue.length === 0) {
                queueEl.innerHTML = '<div class="queue-empty">队列为空</div>';
                btnDequeue.disabled = true;
            } else {
                queueEl.innerHTML = queue.map((item, index) => 
                    `<div class="queue-item">${item}</div>`
                ).join('');
                btnDequeue.disabled = false;
            }

            document.getElementById('queueSize').textContent = queue.length;
            document.getElementById('frontElement').textContent = queue.length > 0 ? queue[0] : '-';
            document.getElementById('rearElement').textContent = queue.length > 0 ? queue[queue.length - 1] : '-';
            document.getElementById('queueStatus').textContent = queue.length === 0 ? '空队列' : 
                (queue.length >= maxSize ? '已满' : `${queue.length}/${maxSize}`);
        }

        function showMessage(text, type = 'info') {
            const existing = document.querySelector('.message');
            if (existing) existing.remove();
            
            const msg = document.createElement('div');
            msg.className = `message ${type}`;
            msg.textContent = text;
            document.body.appendChild(msg);
            
            setTimeout(() => msg.remove(), 2000);
        }

        function enqueue() {
            const input = document.getElementById('inputValue');
            const value = input.value.trim();
            
            if (!value) {
                showMessage('请输入要入队的值', 'error');
                return;
            }
            
            if (queue.length >= maxSize) {
                showMessage('队列已满，无法继续入队', 'error');
                return;
            }
            
            queue.push(value);
            input.value = '';
            updateDisplay();
            showMessage(`"${value}" 已入队`, 'success');
        }

        function dequeue() {
            if (queue.length === 0) {
                showMessage('队列为空，无法出队', 'error');
                return;
            }
            
            const items = document.querySelectorAll('.queue-item');
            const firstItem = items[0];
            if (firstItem) {
                firstItem.classList.add('dequeueing');
            }
            
            setTimeout(() => {
                const value = queue.shift();
                updateDisplay();
                showMessage(`"${value}" 已出队`, 'success');
            }, 250);
        }

        function clearQueue() {
            if (queue.length === 0) {
                showMessage('队列已经是空的', 'info');
                return;
            }
            queue = [];
            updateDisplay();
            showMessage('队列已清空', 'success');
        }

        // 回车键入队
        document.getElementById('inputValue').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enqueue();
        });

        // 初始化
        updateDisplay();
    </script>
</body>
</html>
